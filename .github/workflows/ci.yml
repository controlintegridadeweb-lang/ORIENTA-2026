name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Audit canonical migrations
        run: npm run db:audit:migrations
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
      - run: npm run typecheck
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Lint
        # Falha explicitamente se o ESLint deixar handles abertos ou não encerrar.
        run: timeout --preserve-status 120s npm run lint
      - name: Dead code
        run: npm run check:dead-code
      - run: npm run check:architecture
      - run: npm run check:security-sync
      - run: npm run check:complexity
      - run: npm run check:production-readiness
      - run: npm run check:respondent-seed
      - run: npm run check:diagnostic-import
      - name: Production build
        env:
          NEXT_BUILD_CPUS: "2"
          NEXT_STATIC_GENERATION_CONCURRENCY: "2"
        run: timeout --preserve-status 300s npm run build

  database-integration:
    name: Database integration (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - run: npm ci
      - name: Audit canonical migrations
        run: npm run db:audit:migrations
      - name: Start Supabase local stack
        run: supabase start
      - name: Reset local schema from migrations
        run: supabase db reset --local
      - name: Ensure postgres-meta image for type generation
        # `supabase gen types --db-url/--local` sobe um one-shot postgres-meta.
        # Em runners compartilhados o pull em public.ecr.aws falha com rate limit;
        # reutilizamos a imagem já baixada pelo `supabase start` ou fazemos retry.
        run: |
          set -euo pipefail
          NEED='public.ecr.aws/supabase/postgres-meta:v0.96.1'
          if docker image inspect "$NEED" >/dev/null 2>&1; then
            echo "Image already present: $NEED"
            exit 0
          fi
          EXISTING="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'postgres-meta:' | head -n1 || true)"
          if [ -n "${EXISTING}" ]; then
            echo "Retagging ${EXISTING} -> ${NEED}"
            docker tag "${EXISTING}" "${NEED}"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if docker pull "${NEED}"; then
              exit 0
            fi
            echo "Pull failed (attempt ${attempt}); backing off..."
            sleep $((attempt * 20))
          done
          echo "Could not obtain ${NEED}"
          exit 1
      - name: Verify generated database types
        id: check-generated-types
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_GEN_TYPES_MODE: local
        run: npm run check:generated-types
      - name: Upload generated database types
        if: failure() && steps.check-generated-types.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: generated-database-types
          path: var/database.generated.types.ts
          if-no-files-found: error
      - name: Verify RLS, RPCs and Storage policies against real Supabase PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DB_VERIFY_ONLY: "1"
        run: npm run db:verify
      - name: Verify report persistence and signed URL against real Storage
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          eval "$(supabase status -o env | sed -E 's/^([^=]+)=(.*)$/export \1=\2/')"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          npm run db:verify:reports
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  end-to-end:
    name: End-to-end (Playwright + Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Reset schema and prepare deterministic E2E accounts
        shell: bash
        run: |
          supabase db reset --local
          eval "$(supabase status -o env | sed -E 's/^([^=]+)=(.*)$/export \1=\2/')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_APP_URL="http://127.0.0.1:3002"
          # Persistido para o webServer do Playwright (next build/start) ler as
          # chaves do Supabase local sem depender só da herança de process.env.
          printf '%s\n' \
            "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" \
            "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}" \
            > .env.local
          npm run e2e:prepare
          npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop
